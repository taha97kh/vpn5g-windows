name: Build Windows

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Vet
        run: go vet ./...

      - name: Build vpn5g.exe (windows/amd64, CGO off)
        run: CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o vpn5g.exe .

      - name: Download Xray-core v26.11.9 (windows-64)
        run: |
          curl -sSL -o Xray-windows-64.zip https://github.com/XTLS/Xray-core/releases/download/v26.11.9/Xray-windows-64.zip
          unzip -o Xray-windows-64.zip xray.exe
          ls -l xray.exe

      - name: Package VPN5G-Windows.zip
        run: zip -j VPN5G-Windows.zip vpn5g.exe xray.exe README.md

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VPN5G-Windows
          path: VPN5G-Windows.zip

  smoke-test:
    needs: build
    runs-on: windows-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: VPN5G-Windows

      - name: Extract
        run: Expand-Archive -Path VPN5G-Windows.zip -DestinationPath app -Force

      - name: Run exe and check the UI answers HTTP 200
        shell: pwsh
        run: |
          $env:VPN5G_NO_BROWSER = "1"
          $p = Start-Process -FilePath ".\app\vpn5g.exe" -PassThru
          try {
            $ok = $false
            for ($i = 0; $i -lt 30; $i++) {
              try {
                $r = Invoke-WebRequest -Uri http://127.0.0.1:17890 -UseBasicParsing -TimeoutSec 2
                if ($r.StatusCode -eq 200) { $ok = $true; break }
              } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $ok) { throw "UI did not respond with HTTP 200" }
            if ($p.HasExited) { throw "vpn5g.exe exited unexpectedly" }
            Write-Host "Smoke test passed: UI reachable, process running."
          } finally {
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          }
